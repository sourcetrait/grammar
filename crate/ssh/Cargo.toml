[package]
name = "sourcetrait_grammar_ssh"
description = "Grammar SSH"
version.workspace    = true
authors.workspace    = true
license.workspace    = true
edition.workspace    = true
repository.workspace = true
homepage.workspace   = true
categories.workspace = true
keywords.workspace   = true

[[bin]]
name = "grammar-ssh"
path = "src/main.rs"

[features]
# Test-only engine decls (__test_hang / __test_panic) for the lifecycle system
# tests; never enabled in a shipped build.
test-hooks = ["sourcetrait_grammar_engine/test-hooks"]

[dependencies]
clap.workspace = true
futures-util.workspace = true
serde.workspace = true
tokio.workspace = true
tokio-util.workspace = true
toml.workspace = true

sourcetrait_common.workspace = true
sourcetrait_grammar_engine.workspace = true
sourcetrait_grammar_operator.workspace = true
sourcetrait_grammar_protocol.workspace = true
sourcetrait_grammar_scratch.workspace = true

[target.'cfg(unix)'.dependencies]
nix.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_System_Console"] }

[dev-dependencies]
directories.workspace = true
tempfile.workspace = true

sourcetrait_grammar_client.workspace = true

[package.metadata]
rein = "ai"
